<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ProStudio | Intelligent Monitoring Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #030303;
            --accent: #007aff;
            --border: rgba(255, 255, 255, 0.08);
            --speed-factor: 1; 
            --item-size: 320px;
        }

        * { box-sizing: border-box; outline: none; }
        body, html { 
            margin: 0; padding: 0; 
            background: var(--bg); 
            overflow: hidden; 
            font-family: 'Inter', sans-serif;
            color: white;
            width: 100%;
            height: 100%;
        }

        #viewport {
            width: 100vw; height: 100vh;
            display: flex; align-items: center; justify-content: center;
            background: radial-gradient(circle at 50% 50%, #0a0a0a 0%, #000 100%);
            position: relative;
        }

        /* Tech Grid Overlay */
        #viewport::before {
            content: ''; position: absolute; inset: 0;
            background-image: linear-gradient(var(--border) 1px, transparent 1px), 
                              linear-gradient(90deg, var(--border) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none; z-index: 1;
        }

        #wall {
            display: flex; flex-direction: column; gap: 15px;
            width: 120%; z-index: 0;
        }

        .row {
            display: flex; gap: 15px;
            width: max-content;
            will-change: transform;
        }

        .row-1 { animation: scrollLeft calc(100s / var(--speed-factor)) linear infinite; }
        .row-2 { animation: scrollLeft calc(120s / var(--speed-factor)) linear infinite reverse; }
        .row-3 { animation: scrollLeft calc(110s / var(--speed-factor)) linear infinite; }

        @keyframes scrollLeft {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        .photo-item {
            width: var(--item-size); height: var(--item-size);
            background: #0a0a0a; border-radius: 4px;
            object-fit: cover; cursor: pointer;
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            border: 1px solid var(--border);
            filter: grayscale(40%) brightness(0.6);
        }

        .photo-item:hover {
            filter: grayscale(0%) brightness(1.1);
            transform: scale(1.03);
            border-color: var(--accent);
            box-shadow: 0 0 30px rgba(0,122,255,0.2);
            z-index: 10;
        }

        /* MODAL SYSTEM */
        .modal {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(15px) saturate(180%);
            display: none; align-items: center; justify-content: center;
            z-index: 2000; opacity: 0; transition: all 0.4s ease;
            padding: 20px;
        }

        .modal.active { display: flex; opacity: 1; }

        .modal-content-wrapper {
            position: relative;
            display: flex; flex-direction: column; align-items: center;
            padding: 20px;
            background: rgba(10, 10, 10, 0.95);
            border: 1px solid var(--border);
            border-radius: 15px;
            width: 100%;
            max-width: 600px;
        }

        .modal-image-view {
            max-width: 100%;
            max-height: 60vh;
            border-radius: 8px;
            object-fit: contain;
        }

        /* HUD & Controls (Responsive) */
        .controls, .hud {
            position: fixed; z-index: 100; 
            display: flex; gap: 8px;
            transition: 0.3s;
        }

        .hud { bottom: 20px; left: 20px; flex-direction: column; }
        .controls { bottom: 20px; right: 20px; }

        .status-pill {
            background: rgba(10,10,10,0.8); border: 1px solid var(--border);
            padding: 8px 15px; border-radius: 4px; font-size: 9px; 
            letter-spacing: 1px; font-weight: 700;
            backdrop-filter: blur(10px);
        }

        .speed-btn, .scan-btn {
            border: none; color: white;
            padding: 10px 15px; border-radius: 100px;
            font-size: 9px; font-weight: 700; cursor: pointer;
            transition: 0.3s; letter-spacing: 1px;
        }

        .speed-btn { background: rgba(255,255,255,0.05); border: 1px solid var(--border); opacity: 0.6; }
        .speed-btn.active { background: var(--accent); opacity: 1; border-color: transparent; }
        .scan-btn { background: white; color: black; font-weight: 900; }

        /* Mobile Adjustments */
        @media (max-width: 768px) {
            :root { --item-size: 180px; }
            h1 { font-size: 1.8rem !important; letter-spacing: 8px !important; }
            .btn-start { padding: 15px 30px !important; width: 80%; }
            .hud, .controls { 
                bottom: 15px; 
                left: 50%; 
                transform: translateX(-50%); 
                width: 90%;
                justify-content: center;
                align-items: center;
            }
            .hud { bottom: 70px; flex-direction: row; }
            .controls { bottom: 20px; }
            .speed-btn { padding: 8px 12px; }
        }

        @media (max-height: 500px) and (orientation: landscape) {
            :root { --item-size: 140px; }
            #wall { gap: 10px; }
            .row { gap: 10px; }
            .hud { display: none; } /* Hide HUD in small landscape to save space */
        }

        .btn-close-modal {
            margin-top: 15px; background: transparent; border: 1px solid var(--border);
            color: #aaa; padding: 10px 20px; border-radius: 100px;
            font-size: 9px; font-weight: 800; cursor: pointer;
        }

        .overlay {
            position: fixed; inset: 0; background: #000;
            display: flex; align-items: center; justify-content: center;
            z-index: 3000; transition: 1s; padding: 20px;
        }
        .overlay.hidden { opacity: 0; visibility: hidden; }
        
        .btn-start {
            background: white; color: black; border: none;
            padding: 20px 60px; border-radius: 2px;
            font-weight: 900; cursor: pointer; letter-spacing: 3px; font-size: 11px;
        }

        #qr-container img {
            width: 100%; max-width: 250px; height: auto;
        }
    </style>
</head>
<body>

    <div id="ui" class="overlay">
        <div style="text-align:center; width: 100%;">
            <h1 style="font-weight: 900; letter-spacing: 15px; font-size: 3rem; margin-bottom: 10px;">PROSTUDIO</h1>
            <p style="opacity: 0.3; font-size: 0.6rem; margin-bottom: 40px; letter-spacing: 5px;">INTELLIGENT VISUAL CORE</p>
            <button class="btn-start" onclick="initMonitor()">INITIALIZE SYSTEM</button>
        </div>
    </div>

    <div class="hud">
        <div class="status-pill" id="folderInfo">SYSTEM_IDLE</div>
        <div class="status-pill" id="countInfo">000_DATA_UNITS</div>
    </div>

    <div class="controls">
        <button class="speed-btn active" onclick="setSpeed(1, this)">S_01</button>
        <button class="speed-btn" onclick="setSpeed(4, this)">S_02</button>
        <button class="speed-btn" onclick="setSpeed(10, this)">S_03</button>
        <button class="scan-btn" onclick="openScanModal()">SCAN</button>
    </div>

    <div id="viewport">
        <div id="wall">
            <div id="row1" class="row row-1"></div>
            <div id="row2" class="row row-2"></div>
            <div id="row3" class="row row-3"></div>
        </div>
    </div>

    <!-- MODAL PREVIEW -->
    <div id="previewModal" class="modal">
        <div class="modal-content-wrapper">
            <div id="modalTag" style="color: var(--accent); font-size: 9px; font-weight: 900; letter-spacing: 2px; margin-bottom: 10px;">PREVIEW_UNIT</div>
            <img id="modalImg" class="modal-image-view" src="">
            <button class="btn-close-modal" onclick="closeAllModals()">CLOSE</button>
        </div>
    </div>

    <!-- MODAL SCAN -->
    <div id="scanModal" class="modal">
        <div class="modal-content-wrapper">
            <h2 style="margin:0; letter-spacing: 3px; color: var(--accent); font-size: 1.2rem;">SCAN ACCESS</h2>
            <div id="qr-container" style="background: white; padding: 15px; border-radius: 12px; margin: 20px 0;">
                <img src="qrcode.png" alt="QR Access">
            </div>
            <button class="btn-close-modal" onclick="closeAllModals()">BACK</button>
        </div>
    </div>

    <script>
        let folderHandle;
        let knownFiles = new Set();
        let allImageUrls = [];
        let autoCloseTimer;

        function setSpeed(value, btn) {
            document.documentElement.style.setProperty('--speed-factor', value);
            document.querySelectorAll('.speed-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        function openPreview(url, isAuto = false) {
            clearTimeout(autoCloseTimer);
            const modal = document.getElementById('previewModal');
            document.getElementById('modalImg').src = url;
            document.getElementById('modalTag').innerText = isAuto ? "NEW_DATA_DETECTED" : "PREVIEW_UNIT";
            
            modal.style.display = 'flex';
            setTimeout(() => modal.classList.add('active'), 10);

            if (isAuto) {
                autoCloseTimer = setTimeout(() => {
                    closeAllModals();
                }, 5000);
            }
        }

        function openScanModal() {
            const modal = document.getElementById('scanModal');
            modal.style.display = 'flex';
            setTimeout(() => modal.classList.add('active'), 10);
        }

        function closeAllModals() {
            clearTimeout(autoCloseTimer);
            const modals = document.querySelectorAll('.modal');
            modals.forEach(m => {
                m.classList.remove('active');
                setTimeout(() => { if(!m.classList.contains('active')) m.style.display = 'none' }, 400);
            });
        }

        async function initMonitor() {
            try {
                folderHandle = await window.showDirectoryPicker();
                document.getElementById('ui').classList.add('hidden');
                let folderName = folderHandle.name.length > 15 ? folderHandle.name.substring(0,12) + "..." : folderHandle.name;
                document.getElementById('folderInfo').innerText = "LIVE: " + folderName.toUpperCase();
                await initialScan();
                renderWall();
                setInterval(scanForNewFiles, 1500);
            } catch (e) { console.log("Init aborted."); }
        }

        async function initialScan() {
            for await (const entry of folderHandle.values()) {
                if (entry.kind === 'file' && entry.name.match(/\.(jpg|jpeg|png|webp)$/i)) {
                    knownFiles.add(entry.name);
                    const file = await entry.getFile();
                    allImageUrls.push(URL.createObjectURL(file));
                }
            }
            updateCount();
        }

        async function scanForNewFiles() {
            let foundNew = false;
            for await (const entry of folderHandle.values()) {
                if (entry.kind === 'file' && !knownFiles.has(entry.name)) {
                    const file = await entry.getFile();
                    if (file.size > 0 && file.type.startsWith('image/')) {
                        knownFiles.add(entry.name);
                        const url = URL.createObjectURL(file);
                        allImageUrls.push(url);
                        openPreview(url, true);
                        foundNew = true;
                    }
                }
            }
            if (foundNew) {
                renderWall();
                updateCount();
            }
        }

        function updateCount() {
            document.getElementById('countInfo').innerText = String(knownFiles.size).padStart(3, '0') + "_DATA_UNITS";
        }

        function renderWall() {
            const rows = [document.getElementById('row1'), document.getElementById('row2'), document.getElementById('row3')];
            rows.forEach(r => r.innerHTML = "");
            if (allImageUrls.length === 0) return;

            allImageUrls.forEach((url, index) => {
                rows[index % 3].appendChild(createPhotoEl(url));
            });

            rows.forEach(r => {
                const currentContent = Array.from(r.children);
                if(currentContent.length > 0) {
                    currentContent.forEach(node => {
                        const clone = node.cloneNode(true);
                        clone.onclick = () => openPreview(node.src, false);
                        r.appendChild(clone);
                    });
                }
            });
        }

        function createPhotoEl(url) {
            const img = document.createElement('img');
            img.src = url;
            img.className = 'photo-item';
            img.onclick = () => openPreview(url, false);
            return img;
        }

        window.onclick = (e) => { if (e.target.classList.contains('modal')) closeAllModals(); }
        
        // Handle ESC key
        window.addEventListener('keydown', (e) => {
            if (e.key === "Escape") closeAllModals();
        });
    </script>
</body>
</html>
